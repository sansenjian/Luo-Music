[package]
name = "smtc-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media",
  "Media_Playback",
  "Storage_Streams",
  "Win32_UI_Shell"
] }
